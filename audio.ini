; ==============================================================================
; 音訊自動化測試設定檔 (Audio Test Configuration)
; ==============================================================================

[Device]
; 播放裝置 (Speaker/Headphone) 名稱關鍵字，程式會自動搜尋包含此字串的裝置
outDeviceName=USB
; 播放音量 (0~100)。強烈建議設為 40 左右，開太高 (如 80) 會導致類比訊號削峰破音 (Clipping)
outDeviceVolume=40

; 錄音裝置 (Microphone/Line-In) 名稱關鍵字
inDeviceName=USB
; 錄音音量 (0~100)。建議設為 40，與播放音量匹配，避免 ADC 轉換過載
inDeviceVolume=40

[AudioTest]
; 是否啟用 THD+N (總諧波失真加雜訊) 音質測試 (1: 啟用, 0: 停用)
AudioTestEnable=1

; 左右聲道測試頻率 (Hz)。刻意設定不同 (左2000/右1000) 可用來防呆，檢查產線 3.5mm 音源線是否接反
frequencyL=2000
frequencyR=1000

; 播放測試音後，等待多久才開始錄音 (毫秒)。建議 500ms 給予系統緩衝，避免錄到開頭爆音
waveOutDelay=500

; THD+N 允收門檻 (dB)。數值越小越嚴格。一般 USB 音效卡良品約在 -70 ~ -80 dB。建議門檻: -55 到 -60
thd_n=-60

; 基頻最低音量門檻 (dBFS)。防呆用，確保有確實錄到聲音 (沒插線會掉到 -80以下)。建議門檻: -10
FundamentalLevel_dBFS=-10

; 左右聲道最大音量差 (dB)。用來檢查左右聲道是否平衡 (Balance)，一般容許 3 dB 誤差
MaxLevelDifference_dB=3

; 基頻能量計算頻寬 (Hz)。配合 Blackman-Harris 視窗的頻譜擴散特性，建議設 200，避免誤把主頻當雜訊扣除
FundamentalBandwidthHz=200

; 是否啟用 SNR (訊噪比/底噪) 測試 (1: 啟用, 0: 停用)
SNRTestEnable=1

; SNR 允收門檻 (dB)。數值越大越嚴格。
SNRThreshold=75


[PlayWAVFile]
; 是否啟用播放外部 WAV 檔案功能
PlayWAVFileEnable=0
CloseWAVFileEnable=0
; 播放完畢後是否自動關閉檔案控制代碼 (1: 啟用, 0: 停用)
AutoCloseWAVFile=1
; 測試用 WAV 檔案的絕對路徑
WAVFilePath=C:\Users\T00235\source\repos\DLL\ASAudioDLL\10.wav


[SwitchDefaultAudio]
; 測試前是否強制將 Windows 系統「預設音訊裝置」切換至指定裝置 (1: 啟用, 0: 停用)
SwitchDefaultAudioEnable=0
; 目標裝置名稱關鍵字 (可設定多組)
AudioName=PB258
AudioName1=MG28
; 若有多個同名裝置，要選擇清單中的第幾個 (0 為第一個)
AudioIndex=0


[SetListenToThisDevice]
; 是否透過程式自動勾選 Windows 麥克風內容中的「聆聽此裝置」功能
SetListenToThisDeviceEnable=0
; 目標錄音裝置名稱
ListenDeviceName=Realtek USB
; 1: 勾選 (開啟聆聽), 0: 取消勾選
SetListen=1


[AudioLoopBack]
; 啟用 DirectShow 軟體層音訊迴路 (Software Loopback)。
; 註：部分硬體裝置無法支援硬體監聽時，可改用上方的 SetListenToThisDevice 或此功能
AudioLoopBackEnable=0
; 1: 開始迴路, 0: 停止迴路
AudioLoopBackStart=1